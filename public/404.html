<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | Sajesh Adeya</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The requested page could not be found. Explore case studies, projects, and architecture insights on Sajesh Adeya's portfolio." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#1155CC" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #FAFBFD;
        color: #0F172A;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 24px;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        padding: 48px 36px;
        max-width: 580px;
        width: 100%;
        text-align: center;
      }
      .code {
        font-size: 5rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        background: linear-gradient(135deg, #1155CC 0%, #2563EB 50%, #3B82F6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0F172A;
        margin-bottom: 12px;
      }
      p {
        font-size: 0.95rem;
        color: #64748B;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #1155CC;
        color: #FFFFFF;
      }
      .btn-primary:hover {
        background: #0E44A3;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: #F1F5F9;
        color: #334155;
        border: 1px solid #E2E8F0;
      }
      .btn-secondary:hover {
        background: #E2E8F0;
        color: #0F172A;
      }
      .links {
        border-top: 1px solid #F1F5F9;
        padding-top: 20px;
        font-size: 0.8125rem;
        color: #94A3B8;
      }
      .links a {
        color: #1155CC;
        text-decoration: none;
        font-weight: 500;
        margin: 0 8px;
      }
      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for may have been moved, renamed, or is temporarily unavailable. Let's get you back on track.</p>
      
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <a href="/projects" class="btn btn-secondary">Explore Projects</a>
      </div>

      <div class="links">
        Need assistance? 
        <a href="/about">About Sajesh</a> • 
        <a href="mailto:sajesh@techsonance.co.in">Contact Founder</a>
      </div>
    </main>
  </body>
</html>
